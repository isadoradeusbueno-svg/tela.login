<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="icone">
                USUÁRIO
            </div>
            <h1>Área de login</h1>
            <p class="subtitulo">Digite seus dados para entrar</p>

            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
            <button class="botao-entrar" onclick="verificarLogin()">Entrar</button>
            <button class="botao-limpar" onclick="limparCampos()">Limpar</button>
            <p id="mensagem"></p>
            <div class="dados-teste">
                <strong> Dados para teste</strong>
                <span>Usuário: admin</span>
                <span>Senha: 1234</span>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
